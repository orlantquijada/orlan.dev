packages:
  - apps/*
  - packages/*
  - packages/ui/*

allowBuilds:
  esbuild: true
  sharp: true

catalog:
  "@biomejs/biome": 2.5.14
  "@date-fns/tz": 1.5.0
  "@pandacss/dev": 1.12.1
  "@pandacss/preset-panda": 1.12.1
  "@radix-ui/colors": ^3.0.0
  "@radix-ui/react-icons": ^1.3.2
  "@tsconfig/strictest": ^2.0.8
  date-fns: 4.4.0
  motion: 13.4.1
  next: 16.3.6
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.3
  typescript: 6.0.3
  ultracite: 7.12.0

catalogs:
  react19:
    "@types/react": ^19.3.0
    "@types/react-dom": ^19.3.0
    react: ^19.3.0
    react-dom: ^19.3.0

minimumReleaseAgeExclude:
  - "@clack/core@1.4.0"
  - "@clack/prompts@1.5.0"
  - date-fns@4.4.0
  - next-mdx-remote-client@2.1.11
  - '@astrojs/markdown-satteri@0.4.2'
  - '@astrojs/mdx@8.0.2'
  - '@astrojs/react@7.0.0'
  - '@astrojs/vercel@11.0.11'
  - '@next/env@16.3.6'
  - '@next/mdx@16.3.6'
  - '@next/swc-darwin-arm64@16.3.6'
  - '@next/swc-darwin-x64@16.3.6'
  - '@next/swc-linux-arm64-gnu@16.3.6'
  - '@next/swc-linux-arm64-musl@16.3.6'
  - '@next/swc-linux-x64-gnu@16.3.6'
  - '@next/swc-linux-x64-musl@16.3.6'
  - '@next/swc-win32-arm64-msvc@16.3.6'
  - '@next/swc-win32-x64-msvc@16.3.6'
  - '@turbo/darwin-64@2.11.3'
  - '@turbo/darwin-arm64@2.11.3'
  - '@turbo/linux-64@2.11.3'
  - '@turbo/linux-arm64@2.11.3'
  - '@turbo/windows-64@2.11.3'
  - '@turbo/windows-arm64@2.11.3'
  - astro@7.3.4
  - framer-motion@13.4.1
  - motion-dom@13.4.1
  - motion@13.4.1
  - next@16.3.6
  - turbo@2.11.3

onlyBuiltDependencies:
  - "@biomejs/biome"
  - contentlayer2
  - esbuild
  - protobufjs
  - sharp

# Panda CSS 1.12.1 pins vulnerable patch releases exactly. Scope replacements to
# those versions so Next/Vite and other consumers retain their declared ranges.
overrides:
  browserslist@4.28.1: 4.29.0
  postcss@8.5.14: 8.5.28
  postcss-selector-parser@7.1.1: 7.1.6
  # remark-mdx-frontmatter still requests toml 3; v4 retains its parse API.
  remark-mdx-frontmatter>toml: 4.2.0
  # Vercel's redirect generator accepts the patched path-to-regexp 6.3 API.
  "@vercel/routing-utils>path-to-regexp": 6.3.0
